name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          printf '%s\n' "${JAVA_VER_OUTPUT}"

          JAVA_VER_LINE="$(printf '%s\n' "${JAVA_VER_OUTPUT}" | grep -m1 -E 'version "[0-9]+' || true)"
          RAW_VER="$(printf '%s' "${JAVA_VER_LINE}" | sed -E 's/.*version "([^"]+)".*/\1/')"
          if [ -z "${RAW_VER}" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi

          FIRST_PART="${RAW_VER%%.*}"
          if [ "${FIRST_PART}" = "1" ]; then
            SECOND_PART="${RAW_VER#1.}"
            MAJOR_VER="${SECOND_PART%%.*}"
          else
            MAJOR_VER="${FIRST_PART%%[^0-9]*}"
          fi

          if ! [[ "${MAJOR_VER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine Java major version from '${RAW_VER}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VER}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/keytool" ]; then
              echo "::error::keytool from the configured Java 17 installation was not found under JAVA_HOME."
              exit 1
            fi

            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg "RSA" \
              -keysize 2048 \
              -validity 10000 \
              -noprompt

            if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
              echo "::error::Temporary ./debug.keystore could not be created."
              exit 1
            fi
            echo "Temporary ./debug.keystore generated."
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK does not exist at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" | sort || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK at ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK is missing at ${SOURCE_APK}."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "${REPO_NAME}" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/-+/-/g; s/^[._-]+//; s/[._-]+$//')"
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="app"
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset.XXXXXX")"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed."
            exit 1
          fi

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_NAME}"
          } >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset is missing, empty, or not a valid .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes.XXXXXX.md")"
          printf '%s\n' \
            "This is an automatically generated debug APK." \
            "" \
            "- Built by: GitHub Actions" \
            "- GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            "" \
            "Notice:" \
            "- This APK is intended for testing." \
            "- This APK is not a Play Store production release." \
            "- This APK is signed only with a temporary debug keystore." \
            > "${NOTES_FILE}"

          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${NOTES_FILE}" \
            --latest

      - name: Report APK download result
        id: report_release
        if: ${{ always() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            if RELEASE_ROW="$(gh release view "${RELEASE_TAG}" --json tagName,name,url,assets --jq '[.tagName, .name, .url, (.assets[0].name // "")] | @tsv')" && [ -n "${RELEASE_ROW}" ]; then
              IFS=$'\t' read -r TAG_OUT TITLE_OUT URL_OUT ASSET_OUT <<< "${RELEASE_ROW}"
              if [ -z "${ASSET_OUT}" ]; then
                ASSET_OUT="${ASSET_NAME}"
              fi
              echo "Release Tag: ${TAG_OUT}"
              echo "Release Title: ${TITLE_OUT}"
              echo "GitHub Release URL: ${URL_OUT}"
              echo "APK Asset Filename: ${ASSET_OUT}"

              {
                echo "### Debug APK Build & GitHub Release Succeeded"
                echo ""
                echo "- **Release Tag:** \`${TAG_OUT}\`"
                echo "- **Release Title:** ${TITLE_OUT}"
                echo "- **GitHub Release Page:** ${URL_OUT}"
                echo "- **APK Asset Filename:** \`${ASSET_OUT}\`"
                echo ""
                echo "You can download the APK directly from the **Assets** section on the GitHub Release page."
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
              } >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "::warning::Release publishing completed, but gh release view could not confirm tag ${RELEASE_TAG}. The APK build succeeded and the Actions artifact named app-debug-apk remains available."
              {
                echo "### Debug APK Build Succeeded (Release Verification Warning)"
                echo ""
                echo "> **Warning:** GitHub Release verification failed for tag \`${RELEASE_TAG}\`."
                echo ""
                echo "- **APK Build Status:** Succeeded"
                echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available for download."
              } >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "::warning::GitHub Release publishing failed. The APK build succeeded and the Actions artifact named app-debug-apk remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed. No release was published."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available for download."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
